            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0056b3;
            margin-bottom: 5px;
        }
        .info {
            color: #666;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 12px;
        }
        a {
            display: block;
            padding: 12px 16px;
            background-color: #e9f2ff;
            color: #0056b3;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        a:hover {
            background-color: #cce0ff;
        }
    </style>
</head>
