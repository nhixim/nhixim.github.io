<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Heading canh lề</title>
</head>
<body>
  <!-- 1.2.2. Canh giữa văn bản -->
  <h1 align="center">This is a heading h1</h1>
  <h2 align="center">This is a heading h2</h2>
  <h3 align="center">This is a heading h3</h3>
  <h4 align="center">This is a heading h4</h4>
  <h5 align="center">This is a heading h5</h5>
  <h6 align="center">This is a heading h6</h6>

  <hr>

  <!-- 1.2.3. Phối hợp các loại canh lề -->
  <h1 align="center">This is a heading h1</h1>
  <h2 align="left">This is a heading h2</h2>
  <h3 align="right">This is a heading h3</h3>
  <h4 align="center">This is a heading h4</h4>
  <h5 align="left">This is a heading h5</h5>
  <h6 align="right">This is a heading h6</h6>
</body>
</html>
