<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Khung viền CSS - Mẫu 1</title>
  <style>
    p { padding: 8px; margin: 10px 0; }
    .dotted { border: 3px dotted red; }
    .dashed { border: 3px dashed blue; }
    .solid  { border: 3px solid green; }
    .double { border: 5px double orange; }
    .groove { border: 5px groove gray; }
    .ridge  { border: 5px ridge gray; }
    .inset  { border: 5px inset gray; }
    .outset { border: 5px outset gray; }
    .none   { border: 3px none; }
    .hidden { border: 3px hidden; }
    .mixed  { border-style: dotted solid double dashed; border-width: 4px; border-color: red green blue orange; }
  </style>
</head>
<body>
  <p class="dotted">border-style: dotted</p>
  <p class="dashed">border-style: dashed</p>
  <p class="solid">border-style: solid</p>
  <p class="double">border-style: double</p>
  <p class="groove">border-style: groove</p>
  <p class="ridge">border-style: ridge</p>
  <p class="inset">border-style: inset</p>
  <p class="outset">border-style: outset</p>
  <p class="none">border-style: none</p>
  <p class="hidden">border-style: hidden</p>
  <p class="mixed">border-style: dotted solid double dashed</p>
</body>
</html>
