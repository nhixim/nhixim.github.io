<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Rectangles</title>
  <style>
    .outside {
      border: 8px dotted blue;
      border-radius: 40px;
      padding: 30px;
    }
    .middle {
      border: 3px dashed red;
      border-radius: 30px;
      padding: 30px;
    }
    .inner {
      border: 3px solid green;
      border-radius: 5px;
      padding: 40px;
      text-align: center;
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div class="outside">
    <div class="middle">
      <div class="inner">
        I am heavily packed &ltDIV&gt
      </div>
    </div>
  </div>
</body>
</html>
