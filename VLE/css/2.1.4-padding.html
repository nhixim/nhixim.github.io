<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Khung viền CSS - Mẫu 3</title>
  <style>
    div { border: 1px solid black; background: #ddf; margin-bottom: 10px; }
    .ex1 { width: 300px; }
    .ex2 { width: 300px; padding: 10px; }
    .ex3 { width: 300px; padding: 10px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="ex1">TH1: Phần tử div có width=300 (không padding).</div>
  <div class="ex2">TH2: Phần tử div có padding=10 và width=300, kích thước thực tế = 300 + 2*10 + 2*1 = 322px.</div>
  <div class="ex3">TH3: Có box-sizing: border-box nên kích thước thực tế vẫn là 300px, padding được tính vào trong width.</div>
</body>
</html>
