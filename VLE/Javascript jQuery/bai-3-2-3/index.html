<body><main>

<h1>3.2.3. Tính số ngày trong tháng</h1>
<ul class="muted"><li>Tháng 1, 3, 5, 7, 8, 10, 12: 31 ngày</li><li>Tháng 2: 28 hoặc 29 ngày (năm nhuận)</li><li>Tháng 4, 6, 9, 11: 30 ngày</li></ul>
<div class="card">
<label for="thang">Nhập tháng (1–12)</label><input id="thang" type="number" min="1" max="12" value="1">
<label for="nam">Năm (chỉ dùng cho tháng 2, bỏ trống = 28 ngày)</label><input id="nam" type="number" placeholder="Ví dụ: 2024">
<button id="btn">Tính</button>
<div class="result" id="kq"></div>
</div>
