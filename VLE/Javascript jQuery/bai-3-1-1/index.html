<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3.1.1. Tính lãi suất ngân hàng</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><main>
<a href="../">← Danh sách bài</a>
<h1>3.1.1. Tính lãi suất ngân hàng</h1>
<p class="muted">Lãi đơn: Tổng = Gốc + n × (Gốc × Lãi suất%).</p>
<div class="card">
<label for="goc">Số tiền vay (triệu đồng)</label><input id="goc" type="number" min="0" step="any" value="50">
<label for="laisuat">Lãi suất (%/năm)</label><input id="laisuat" type="number" min="0" step="any" value="8">
<label for="nam">Số năm (n)</label><input id="nam" type="number" min="0" step="any" value="2">
<button id="btn">Tính</button>
<div class="result" id="kq"></div>
</div>
<script src="script.js"></script></main></body></html>
