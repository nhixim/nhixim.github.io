<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3.2.1. Hiệu chỉnh theo sự kiện chuột</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><main>
<a href="../">← Danh sách bài</a>
<h1>3.2.1. Hiệu chỉnh theo sự kiện chuột</h1>
<div class="card"><h3>1. Đổi nội dung thẻ div khi rê chuột</h3>
<div id="hoverBox" class="card" style="text-align:center;margin:0">Hover Me</div></div>
<div class="card"><h3>2. Ảnh phóng to 10% khi rê chuột</h3>
<img id="anh" src="../assets/demo.svg" alt="Ảnh minh hoạ" width="200" style="transition:width .15s;display:block"></div>
<div class="card"><h3>3. Hiển thị ngày giờ hiện tại</h3>
<button id="btnTime">Xem ngày giờ</button></div>
<div class="card"><h3>4. Chuyển nội dung textbox sang IN HOA</h3>
<input id="txt" type="text" placeholder="Nhập chữ vào đây"><button id="btnUpper">IN HOA</button></div>
<script src="script.js"></script></main></body></html>
