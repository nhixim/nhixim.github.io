<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3.1.2. Kiểm tra năm nhuận</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><main>
<a href="../">← Danh sách bài</a>
<h1>3.1.2. Kiểm tra năm nhuận</h1>
<div class="card">
<label for="year">Nhập năm cần kiểm tra</label><input id="year" type="number" value="2000">
<button id="btnYear">Kiểm tra</button>
<div class="result" id="kqYear"></div>
</div>
<h2>Bổ sung: số ngày trong tháng</h2>
<div class="card">
<label for="thang">Tháng (1–12)</label><input id="thang" type="number" min="1" max="12" value="2">
<label for="namThang">Năm (để xác định tháng 2)</label><input id="namThang" type="number" value="2024">
<button id="btnThang">Xem số ngày</button>
<div class="result" id="kqThang"></div>
</div>
<script src="script.js"></script></main></body></html>
